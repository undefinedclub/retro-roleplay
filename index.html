  <script>
    (()=>{
      const STORAGE_KEY='retro-roleplay-family-os-v1';
      const dateOffset=offset=>{const date=new Date();date.setDate(date.getDate()+offset);return date.toISOString().slice(0,10)};
      const initialState={family:'Retro Family',members:[{id:'m1',name:'Alex Rivera',rank:'Familienleitung',joined:'2024-02-14',status:'Aktiv',contact:'Alex Rivera'},{id:'m2',name:'Mia Santos',rank:'Rechte Hand',joined:'2024-03-08',status:'Aktiv',contact:'Mia Santos'},{id:'m3',name:'Dante Moretti',rank:'Schwarzmarkthändler',joined:'2024-05-22',status:'Aktiv',contact:'Dante Moretti'},{id:'m4',name:'Lena Cruz',rank:'Mitglied',joined:'2024-06-11',status:'Abwesend',contact:'Lena Cruz'},{id:'m5',name:'Nico Vega',rank:'Mitglied',joined:'2024-08-03',status:'Aktiv',contact:'Nico Vega'}],tasks:[{id:'t1',title:'Lieferung am Hafen koordinieren',owner:'Mia Santos',due:dateOffset(0),priority:'Hoch',status:'Offen'},{id:'t2',title:'Fahrzeuge für das Treffen prüfen',owner:'Nico Vega',due:dateOffset(1),priority:'Normal',status:'In Arbeit'},{id:'t3',title:'Neue Kontakte im Club ansprechen',owner:'Lena Cruz',due:dateOffset(2),priority:'Normal',status:'Offen'}],finances:[{id:'f1',label:'Club-Einnahmen',type:'Einnahme',amount:12500,category:'Geschäft',date:dateOffset(0)},{id:'f2',label:'Fahrzeugwartung',type:'Ausgabe',amount:2800,category:'Fuhrpark',date:dateOffset(-1)},{id:'f3',label:'Warenverkauf',type:'Einnahme',amount:6400,category:'Handel',date:dateOffset(-2)}],inventory:[{id:'i1',name:'Sportlimousine',quantity:4,category:'Fahrzeuge',location:'Garage Süd'},{id:'i2',name:'Erste-Hilfe-Set',quantity:12,category:'Ausrüstung',location:'Club-Lager'},{id:'i3',name:'Funkgerät',quantity:8,category:'Ausrüstung',location:'Club-Lager'},{id:'i4',name:'Event-Dekoration',quantity:3,category:'Sonstiges',location:'Lagerhaus 4'}],events:[{id:'e1',title:'Familientreffen',date:dateOffset(1),time:'20:30',location:'Retro Club',type:'Intern'},{id:'e2',title:'Hafenlieferung',date:dateOffset(2),time:'22:00',location:'Südlicher Hafen',type:'Geschäft'},{id:'e3',title:'Clubabend',date:dateOffset(4),time:'21:00',location:'Retro Club',type:'Event'}],activity:[]};
      function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));return saved&&Array.isArray(saved.members)?{...structuredClone(initialState),...saved}:structuredClone(initialState)}catch{return structuredClone(initialState)}}
      let state=loadState(),activePage='dashboard',searchTerm='';const content=document.querySelector('#content'),overlayRoot=document.querySelector('#overlay-root');
      const pageNames={dashboard:'DASHBOARD',members:'MITGLIEDER',tasks:'AUFGABEN',finances:'FINANZEN',inventory:'LAGER',events:'TERMINE',settings:'EINSTELLUNGEN'};
      const fmtMoney=value=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value);
      const fmtDate=value=>value?new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(value+'T12:00:00')):'—';
      const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const initials=name=>String(name||'?').split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
      const persist=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateCounts()};
      function updateCounts(){document.querySelector('#member-count').textContent=state.members.length;document.querySelector('#task-count').textContent=state.tasks.filter(item=>item.status!=='Erledigt').length;document.querySelector('#family-mini-name').textContent=state.family}
      function notify(message){document.querySelector('.toast')?.remove();const toast=document.createElement('div');toast.className='toast';toast.textContent=message;document.body.append(toast);setTimeout(()=>toast.remove(),2800)}
      function makeId(){return Math.random().toString(36).slice(2,9)}
      function logActivity(action,detail){state.activity.unshift({id:makeId(),action,detail,date:new Date().toISOString()});state.activity=state.activity.slice(0,8);persist()}
      function setPage(page){activePage=page;searchTerm='';document.querySelectorAll('.nav-item[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===page));document.querySelector('#crumb-page').textContent=pageNames[page];document.querySelector('#sidebar').classList.remove('open');document.querySelector('#scrim').classList.remove('visible');render();window.scrollTo({top:0,behavior:'smooth'})}
      function heading(kicker,title,description,action=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`}
      function render(){updateCounts();content.innerHTML=({dashboard:dashboardPage,members:membersPage,tasks:tasksPage,finances:financesPage,inventory:inventoryPage,events:eventsPage,settings:settingsPage})[activePage]();bindContent()}
      function dashboardPage(){const balance=state.finances.reduce((sum,item)=>sum+(item.type==='Einnahme'?Number(item.amount):-Number(item.amount)),0),upcoming=state.events.filter(item=>item.date>=dateOffset(0)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),activity=state.activity.slice(0,4);return `${heading('VICE CITY · FAMILY OPERATIONS','Guten Abend, Alex.','Alles im Blick. Alles unter Kontrolle.')}<section class="hero"><div class="sun"></div><svg class="palms" viewBox="0 0 500 220" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path class="palm-trunk" d="M376 223c-12-53-16-98-4-143 4-15 12-29 24-42l7 6c-13 22-18 44-19 69-2 34 8 71 15 110z"/><path class="palm-leaf" d="M395 41C365 20 335 17 302 22c31 0 54 11 77 30-28-15-57-17-87-9 36-2 63 8 91 23-19-20-32-43-37-69 11 28 28 49 51 66-3-31 6-57 22-80-9 26-10 51-4 77 11-27 29-45 54-58-20 18-33 38-42 64 24-20 51-28 82-27-29 5-52 17-74 37 31-10 61-8 92 3-33-5-60-1-88 12z"/><path class="palm-trunk" d="M457 223c-6-33-8-62-2-91 2-10 7-18 13-27l6 4c-9 16-11 30-10 48 1 22 6 42 11 66z"/><path class="palm-leaf" d="M468 113c-20-14-42-17-65-14 23 0 42 7 59 19-21-9-42-10-64-4 27-1 45 6 65 17-13-15-22-31-24-50 7 20 17 36 34 49-2-23 4-42 16-58-6 19-7 37-3 56 8-20 21-33 39-42-14 13-24 28-30 47 17-15 37-21 59-20-21 3-38 12-53 26 22-7 44-6 66 2-24-4-43-1-63 9z"/></svg><div class="hero-grain"></div><div class="hero-copy"><div class="eyebrow">${escapeHtml(state.family)} · VICE CITY</div><h2>Die Nacht gehört denen, die vorbereitet sind.</h2><p>Deine Leute, deine Geschäfte, dein nächster Zug. Willkommen zurück im Family OS.</p><div class="hero-meta"><span><b>●</b> SYSTEM ONLINE</span><span>LOKALZEIT <b id="local-clock">--:--</b></span><span>STATUS <b>STABIL</b></span></div></div></section><section class="metrics"><article class="metric"><div class="metric-top"><span>Aktive Mitglieder</span><span class="metric-icon">♙</span></div><div class="metric-value" data-count="${state.members.length}">0</div><div class="metric-note up">${state.members.filter(item=>item.status==='Aktiv').length} derzeit verfügbar</div></article><article class="metric"><div class="metric-top"><span>Offene Aufgaben</span><span class="metric-icon">▣</span></div><div class="metric-value" data-count="${state.tasks.filter(item=>item.status!=='Erledigt').length}">0</div><div class="metric-note">${state.tasks.filter(item=>item.status==='In Arbeit').length} in Bearbeitung</div></article><article class="metric"><div class="metric-top"><span>Kassenstand</span><span class="metric-icon">＄</span></div><div class="metric-value" data-money="${balance}">${fmtMoney(balance)}</div><div class="metric-note">Netto · alle Buchungen</div></article><article class="metric"><div class="metric-top"><span>Lagerpositionen</span><span class="metric-icon">▤</span></div><div class="metric-value" data-count="${state.inventory.reduce((sum,item)=>sum+Number(item.quantity),0)}">0</div><div class="metric-note">Einheiten erfasst</div></article></section><section class="dashboard-grid"><article class="panel"><div class="panel-head"><h3>Letzte Aktivitäten</h3><span>LIVE FEED</span></div><div class="panel-body">${activity.length?activity.map(item=>`<div class="activity-row"><span class="activity-mark">✦</span><div class="activity-text"><strong>${escapeHtml(item.action)}</strong><small>${escapeHtml(item.detail)}</small></div><span class="activity-time">${timeAgo(item.date)}</span></div>`).join(''):'<div class="empty">Noch keine Aktivitäten. Änderungen in den Modulen erscheinen hier.</div>'}</div></article><article class="panel"><div class="panel-head"><h3>Als Nächstes</h3><span>TERMINE</span></div><div class="quick-list">${upcoming.length?upcoming.map(item=>`<div class="quick-row"><span class="quick-indicator"></span><strong>${escapeHtml(item.title)}</strong><small>${fmtDate(item.date)} · ${escapeHtml(item.time)}</small></div>`).join(''):'<div class="empty">Keine anstehenden Termine.</div>'}</div></article></section>`}
      function timeAgo(value){const minutes=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/60000));return minutes<1?'JETZT':minutes<60?`${minutes} MIN`:minutes<1440?`${Math.floor(minutes/60)} STD`:`${Math.floor(minutes/1440)} TAG`}
      function filterItems(items,fields){const term=searchTerm.toLocaleLowerCase('de');return items.filter(item=>fields.some(key=>String(item[key]||'').toLocaleLowerCase('de').includes(term)))}
      function searchToolbar(placeholder){return `<div class="toolbar"><div class="search-wrap"><span class="search-symbol">⌕</span><input id="module-search" type="search" placeholder="${placeholder}" value="${escapeHtml(searchTerm)}" aria-label="${placeholder}"></div></div>`}
      function membersPage(){const items=filterItems(state.members,['name','rank','status']);return `${heading('FAMILIENSTAMM','Mitglieder','Verwalte Ränge, Zugang und Anwesenheit deiner Familie.','<button class="primary-button" data-action="add-member">＋ Mitglied aufnehmen</button>')}${searchToolbar('Name, Rang oder Status suchen')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Mitglied</th><th>Rang</th><th>Beitritt</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td><div class="person-cell"><span class="avatar">${initials(item.name)}</span><span><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.contact||'')}</small></span></div></td><td>${escapeHtml(item.rank)}</td><td>${fmtDate(item.joined)}</td><td><span class="badge ${item.status==='Aktiv'?'green':'gray'}">${escapeHtml(item.status)}</span></td><td><div class="row-actions"><button class="tiny-button" data-action="edit-member" data-id="${item.id}">Bearbeiten</button><button class="tiny-button" data-action="delete" data-kind="member" data-id="${item.id}">Entfernen</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Keine Mitglieder gefunden.</td></tr>'}</tbody></table></div>`}
      function tasksPage(){const items=filterItems(state.tasks,['title','owner','status','priority']);return `${heading('OPERATIONS','Aufgaben','Klare Zuständigkeiten. Verlässliche Umsetzung.','<button class="primary-button" data-action="add-task">＋ Aufgabe erstellen</button>')}${searchToolbar('Aufgaben oder Zuständige suchen')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Aufgabe</th><th>Zuständig</th><th>Fällig</th><th>Priorität</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td><strong>${escapeHtml(item.title)}</strong></td><td>${escapeHtml(item.owner)}</td><td>${fmtDate(item.due)}</td><td><span class="badge ${item.priority==='Hoch'?'orange':'gray'}">${escapeHtml(item.priority)}</span></td><td><select class="tiny-button status-select" data-action="task-status" data-id="${item.id}" aria-label="Status ändern"><option ${item.status==='Offen'?'selected':''}>Offen</option><option ${item.status==='In Arbeit'?'selected':''}>In Arbeit</option><option ${item.status==='Erledigt'?'selected':''}>Erledigt</option></select></td><td><button class="tiny-button" data-action="delete" data-kind="task" data-id="${item.id}">Löschen</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Keine Aufgaben gefunden.</td></tr>'}</tbody></table></div>`}
      function financesPage(){const incoming=state.finances.filter(item=>item.type==='Einnahme').reduce((sum,item)=>sum+Number(item.amount),0),outgoing=state.finances.filter(item=>item.type==='Ausgabe').reduce((sum,item)=>sum+Number(item.amount),0),items=filterItems(state.finances,['label','category','type']);return `${heading('FAMILY TREASURY','Finanzen','Behalte Einnahmen, Ausgaben und Familienkasse im Blick.','<button class="primary-button" data-action="add-finance">＋ Buchung erfassen</button>')}<div class="summary-strip"><div class="summary-chip"><small>Einnahmen gesamt</small><strong>${fmtMoney(incoming)}</strong></div><div class="summary-chip"><small>Ausgaben gesamt</small><strong>${fmtMoney(outgoing)}</strong></div><div class="summary-chip"><small>Aktueller Saldo</small><strong>${fmtMoney(incoming-outgoing)}</strong></div></div>${searchToolbar('Buchungen suchen')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Buchung</th><th>Kategorie</th><th>Art</th><th>Betrag</th><th>Datum</th><th>Aktionen</th></tr></thead><tbody>${items.length?items.sort((a,b)=>b.date.localeCompare(a.date)).map(item=>`<tr><td><strong>${escapeHtml(item.label)}</strong></td><td>${escapeHtml(item.category)}</td><td><span class="badge ${item.type==='Einnahme'?'green':'orange'}">${escapeHtml(item.type)}</span></td><td>${item.type==='Einnahme'?'+':'−'}${fmtMoney(item.amount)}</td><td>${fmtDate(item.date)}</td><td><button class="tiny-button" data-action="delete" data-kind="finance" data-id="${item.id}">Löschen</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Keine Buchungen gefunden.</td></tr>'}</tbody></table></div>`}
      function inventoryPage(){const items=filterItems(state.inventory,['name','category','location']),total=state.inventory.reduce((sum,item)=>sum+Number(item.quantity),0);return `${heading('SUPPLY & STORAGE','Lagerverwaltung','Bestände und Standorte zentral dokumentiert.','<button class="primary-button" data-action="add-inventory">＋ Bestand erfassen</button>')}<div class="summary-strip"><div class="summary-chip"><small>Positionen</small><strong>${state.inventory.length}</strong></div><div class="summary-chip"><small>Einheiten gesamt</small><strong>${total}</strong></div><div class="summary-chip"><small>Lagerorte</small><strong>${new Set(state.inventory.map(item=>item.location)).size}</strong></div></div>${searchToolbar('Artikel, Kategorie oder Ort suchen')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Artikel</th><th>Kategorie</th><th>Bestand</th><th>Lagerort</th><th>Aktionen</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td><strong>${escapeHtml(item.name)}</strong></td><td><span class="badge gray">${escapeHtml(item.category)}</span></td><td>${escapeHtml(item.quantity)} Stück</td><td>${escapeHtml(item.location)}</td><td><div class="row-actions"><button class="tiny-button" data-action="stock" data-id="${item.id}" data-delta="-1" aria-label="Bestand reduzieren">−</button><button class="tiny-button" data-action="stock" data-id="${item.id}" data-delta="1" aria-label="Bestand erhöhen">＋</button><button class="tiny-button" data-action="delete" data-kind="inventory" data-id="${item.id}">Löschen</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Keine Lagerpositionen gefunden.</td></tr>'}</tbody></table></div>`}
      function eventsPage(){const items=filterItems(state.events,['title','location','type']).sort((a,b)=>a.date.localeCompare(b.date));return `${heading('VICE CITY CALENDAR','Termine','Familientreffen, Geschäftstermine und Events koordinieren.','<button class="primary-button" data-action="add-event">＋ Termin planen</button>')}${searchToolbar('Termin, Ort oder Typ suchen')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Termin</th><th>Datum</th><th>Uhrzeit</th><th>Ort</th><th>Typ</th><th>Aktionen</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td><strong>${escapeHtml(item.title)}</strong></td><td>${fmtDate(item.date)}</td><td>${escapeHtml(item.time)}</td><td>${escapeHtml(item.location)}</td><td><span class="badge gray">${escapeHtml(item.type)}</span></td><td><button class="tiny-button" data-action="delete" data-kind="event" data-id="${item.id}">Absagen</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Keine Termine gefunden.</td></tr>'}</tbody></table></div>`}
      function settingsPage(){return `${heading('SYSTEM CONFIGURATION','Einstellungen','Deine Fraktion. Deine Daten. Alles bleibt auf diesem Gerät.')}<div class="settings-grid"><section class="panel settings-panel"><h3>Familienprofil</h3><p>Der Name wird im gesamten Kontrollzentrum verwendet.</p><form id="family-form"><div class="field"><label for="family-name">Familienname</label><input id="family-name" name="family" value="${escapeHtml(state.family)}" required maxlength="40"></div><button class="primary-button" type="submit">Änderungen speichern</button></form></section><section class="panel settings-panel"><h3>Datenverwaltung</h3><p>Exportiere ein Backup oder importiere einen bestehenden JSON-Stand.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="subtle-button" data-action="export">↓ Backup exportieren</button><button class="subtle-button" data-action="import">↑ Backup importieren</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></section><section class="panel settings-panel"><h3>Lokale Speicherung</h3><p>Alle Einträge liegen ausschließlich im lokalen Browser-Speicher. Es wird kein Konto und kein Server benötigt.</p><span class="badge green">● LOKAL AKTIV</span></section><section class="panel settings-panel"><h3>Demo-Daten</h3><p>Setze den Arbeitsbereich auf den ursprünglichen Beispielstand zurück.</p><button class="subtle-button" data-action="reset">Beispieldaten wiederherstellen</button></section></div>`}
      function bindContent(){const search=document.querySelector('#module-search');if(search)search.addEventListener('input',event=>{const cursor=event.target.selectionStart;searchTerm=event.target.value;render();const next=document.querySelector('#module-search');next.focus();next.setSelectionRange(cursor,cursor)});content.querySelectorAll('[data-action]').forEach(element=>{if(element.matches('.status-select'))element.addEventListener('change',()=>changeTaskStatus(element.dataset.id,element.value));else element.addEventListener('click',()=>handleAction(element.dataset.action,element))});const familyForm=document.querySelector('#family-form');if(familyForm)familyForm.addEventListener('submit',event=>{event.preventDefault();state.family=new FormData(familyForm).get('family').trim()||'Retro Family';persist();logActivity('Familienprofil aktualisiert',state.family);notify('Familienname gespeichert.');render()});const importFile=document.querySelector('#import-file');if(importFile)importFile.addEventListener('change',importBackup);if(activePage==='dashboard')animateMetrics()}
      function animateMetrics(){document.querySelectorAll('[data-count]').forEach(element=>{const target=Number(element.dataset.count),start=performance.now(),duration=650;function frame(now){const progress=Math.min(1,(now-start)/duration);element.textContent=Math.round(target*(1-Math.pow(1-progress,3)));if(progress<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)});const clock=document.querySelector('#local-clock');if(clock)clock.textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
      function handleAction(action,element){if(action==='add-member'||action==='edit-member')openForm('member',action==='edit-member'?state.members.find(item=>item.id===element.dataset.id):null);else if(action.startsWith('add-'))openForm(action.slice(4));else if(action==='delete')deleteItem(element.dataset.kind,element.dataset.id);else if(action==='stock')adjustStock(element.dataset.id,Number(element.dataset.delta));else if(action==='export')exportBackup();else if(action==='import')document.querySelector('#import-file').click();else if(action==='reset')resetData()}
      function openForm(kind,item=null){const configs={member:{title:item?'Mitglied bearbeiten':'Mitglied aufnehmen',fields:[['name','Name','text',item?.name||''],['rank','Rang','text',item?.rank?.trim()||'Mitglied'],['joined','Beitrittsdatum','date',item?.joined||dateOffset(0)],['status','Status','select',item?.status||'Aktiv',['Aktiv','Abwesend']],['contact','Kontakt / Funkname','text',item?.contact||'']]},task:{title:'Aufgabe erstellen',fields:[['title','Aufgabe','text',''],['owner','Zuständig','select','',state.members.map(member=>member.name)],['due','Fällig am','date',dateOffset(0)],['priority','Priorität','select','Normal',['Normal','Hoch']],['status','Status','select','Offen',['Offen','In Arbeit','Erledigt']]]},finance:{title:'Buchung erfassen',fields:[['label','Bezeichnung','text',''],['type','Buchungsart','select','Einnahme',['Einnahme','Ausgabe']],['amount','Betrag (USD)','number',''],['category','Kategorie','text','Allgemein'],['date','Datum','date',dateOffset(0)]]},inventory:{title:'Bestand erfassen',fields:[['name','Artikel','text',''],['category','Kategorie','select','Ausrüstung',['Ausrüstung','Fahrzeuge','Geschäft','Sonstiges']],['quantity','Menge','number','1'],['location','Lagerort','text','Club-Lager']]},event:{title:'Termin planen',fields:[['title','Termin','text',''],['date','Datum','date',dateOffset(0)],['time','Uhrzeit','time','20:00'],['location','Ort','text',''],['type','Typ','select','Intern',['Intern','Geschäft','Event']]]}};const config=configs[kind];if(!config)return;overlayRoot.innerHTML=`<div class="modal-backdrop" data-close><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${config.title}</h2><button class="icon-button" data-close aria-label="Dialog schließen">×</button></div><form class="modal-body" id="entry-form"><div class="form-grid">${config.fields.map(([name,label,type,value,options])=>`<div class="field"><label for="field-${name}">${label}</label>${type==='select'?`<select id="field-${name}" name="${name}" required>${options.map(option=>`<option ${option===value?'selected':''}>${escapeHtml(option)}</option>`).join('')}</select>`:`<input id="field-${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${['name','title','amount','quantity','date','owner','location','label'].includes(name)?'required':''} ${type==='number'?'min="0" step="1"':''}>`}</div>`).join('')}</div><div class="modal-actions"><button class="subtle-button" type="button" data-close>Abbrechen</button><button class="primary-button" type="submit">Speichern</button></div></form></section></div>`;overlayRoot.querySelectorAll('[data-close]').forEach(element=>element.addEventListener('click',event=>{if(event.target===element||element.matches('button'))overlayRoot.innerHTML=''}));overlayRoot.querySelector('#entry-form').addEventListener('submit',event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget).entries());if(kind==='finance')values.amount=Number(values.amount);if(kind==='inventory')values.quantity=Number(values.quantity);if(kind==='member'&&item){Object.assign(item,values);logActivity('Mitglied aktualisiert',item.name)}else{const listKey={member:'members',task:'tasks',finance:'finances',inventory:'inventory',event:'events'}[kind],entry={id:makeId(),...values};state[listKey].unshift(entry);logActivity(({member:'Neues Mitglied aufgenommen',task:'Neue Aufgabe erstellt',finance:'Buchung erfasst',inventory:'Lagerbestand aktualisiert',event:'Neuer Termin geplant'})[kind],values.name||values.title||values.label)}persist();overlayRoot.innerHTML='';render();notify(item?'Änderungen gespeichert.':'Eintrag wurde gespeichert.')});overlayRoot.querySelector('input,select')?.focus()}
      function deleteItem(kind,id){const names={member:'Mitglied',task:'Aufgabe',finance:'Buchung',inventory:'Lagerposition',event:'Termin'};if(!confirm(`${names[kind]} wirklich entfernen?`))return;const key={member:'members',task:'tasks',finance:'finances',inventory:'inventory',event:'events'}[kind],item=state[key].find(entry=>entry.id===id);state[key]=state[key].filter(entry=>entry.id!==id);logActivity(`${names[kind]} entfernt`,item?.name||item?.title||item?.label||'Eintrag');render();notify(`${names[kind]} entfernt.`)}
      function changeTaskStatus(id,status){const item=state.tasks.find(entry=>entry.id===id);if(!item)return;item.status=status;persist();logActivity('Aufgabenstatus geändert',`${item.title} · ${status}`);render();notify('Aufgabenstatus aktualisiert.')}
      function adjustStock(id,delta){const item=state.inventory.find(entry=>entry.id===id);if(!item)return;if(item.quantity+delta<0){notify('Der Bestand kann nicht unter null sinken.');return}item.quantity+=delta;persist();logActivity('Lagerbestand angepasst',`${item.name} · ${item.quantity} Stück`);render()}
      function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`retro-roleplay-backup-${dateOffset(0)}.json`;link.click();URL.revokeObjectURL(link.href);notify('Backup wurde heruntergeladen.')}
      function importBackup(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!['members','tasks','finances','inventory','events'].every(key=>Array.isArray(data[key])))throw new Error('Ungültige Datenstruktur');state={...structuredClone(initialState),...data};persist();render();notify('Backup erfolgreich importiert.')}catch{notify('Import fehlgeschlagen: ungültige JSON-Datei.')}event.target.value=''};reader.readAsText(file)}
      function resetData(){if(!confirm('Alle lokalen Änderungen verwerfen und Beispieldaten wiederherstellen?'))return;state=structuredClone(initialState);persist();render();notify('Beispieldaten wurden wiederhergestellt.')}
      document.querySelectorAll('.nav-item[data-page]').forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.page)));document.querySelector('#quick-add').addEventListener('click',()=>openForm(({members:'member',tasks:'task',finances:'finance',inventory:'inventory',events:'event'})[activePage]||'task'));document.querySelector('#menu-toggle').addEventListener('click',()=>{document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#scrim').classList.toggle('visible')});document.querySelector('#scrim').addEventListener('click',()=>{document.querySelector('#sidebar').classList.remove('open');document.querySelector('#scrim').classList.remove('visible')});document.querySelector('#today').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date()).toUpperCase();render();
    })();
  </script>
